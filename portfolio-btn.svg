<svg xmlns="http://www.w3.org/2000/svg" width="500" height="120" viewBox="0 0 500 120">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <clipPath id="btn-clip">
      <rect x="6" y="6" width="488" height="108" rx="16" />
    </clipPath>
  </defs>
  <style>
    .border-glow {
      animation: glow-pulse 2.5s infinite alternate ease-in-out;
    }
    @keyframes glow-pulse {
      0% { opacity: 0.4; }
      100% { opacity: 1; }
    }
    .text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 38px;
      font-weight: 800;
      fill: #ffffff;
      letter-spacing: 6px;
    }
    .shine {
      animation: shine-sweep 5s infinite linear;
    }
    @keyframes shine-sweep {
      0% { transform: translateX(-200px); }
      15% { transform: translateX(600px); }
      100% { transform: translateX(600px); }
    }
  </style>

  <!-- Glowing Border -->
  <rect x="2" y="2" width="496" height="116" rx="20" fill="url(#glow)" class="border-glow" />
  
  <!-- Main Background -->
  <rect x="6" y="6" width="488" height="108" rx="16" fill="url(#bg)" />

  <!-- Shine Effect Overlay -->
  <g clip-path="url(#btn-clip)">
    <polygon points="-60,0 20,0 80,120 0,120" fill="rgba(255,255,255,0.15)" class="shine" />
  </g>
  
  <!-- Text -->
  <text x="50%" y="54%" dominant-baseline="middle" text-anchor="middle" class="text">PORTFOLIO</text>
</svg>
